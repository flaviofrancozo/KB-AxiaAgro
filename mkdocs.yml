site_name: TechDocs
site_description: Base pública e sanitizada de conhecimento técnico
site_author: TechDocs - Tecnologia da Informação
site_url: https://flaviofrancozo.github.io/KB-AxiaAgro/
repo_url: https://github.com/flaviofrancozo/KB-AxiaAgro
repo_name: flaviofrancozo/KB-AxiaAgro
edit_uri: edit/agent/redesign-techdocs-v2/docs/
copyright: Conteúdo público e sanitizado — nunca inclua dados internos ou pessoais.

theme:
  name: material
  language: pt-BR
  custom_dir: overrides
  logo: assets/images/logo-techdocs-modelo3-final.png
  favicon: assets/images/favicon-techdocs.png
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - scheme: axia-light
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Ativar modo escuro
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Ativar modo claro
  font:
    text: Inter
    code: JetBrains Mono

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang: pt

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Início: index.md
  - Governança: governanca/index.md
  - Documentos legados: governanca/portal-empresa/index.md
  - Microsoft 365: microsoft-365/index.md
  - Exchange Online: microsoft-365/exchange-online/index.md
  - Entra ID: entra-id/index.md
  - Intune: intune/index.md
  - Defender: defender/index.md
  - Cybersegurança: cyberseguranca/index.md
  - Infraestrutura: infraestrutura/index.md
  - Procedimentos: procedimentos/index.md
  - Processos: processos/index.md
  - Troubleshooting: troubleshooting/index.md
  - Scripts:
    - Visão Geral: scripts/index.md
    - Atualiza BLUE V2:
        - Procedimento Técnico: processos/automacoes/atualiza-blue-v2/index.md
        - Governança: governanca/automacoes/atualiza-blue-v2/index.md
        - Evidências: evidencias/atualiza-blue-v2/index.md
  - Histórico: changelog/index.md
