site_name: TechDocs
site_description: Base pública e sanitizada de conhecimento técnico
site_author: TechDocs - Tecnologia da Informação
site_url: https://flaviofrancozo.github.io/KB-AxiaAgro/
repo_url: https://github.com/flaviofrancozo/KB-AxiaAgro
repo_name: flaviofrancozo/KB-AxiaAgro
edit_uri: edit/main/docs/
copyright: Conteúdo público e sanitizado — nunca inclua dados internos ou pessoais.

theme:
  name: material
  language: pt-BR
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - scheme: axia-light
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Ativar modo escuro
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Ativar modo claro
  font:
    text: Inter
    code: JetBrains Mono

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang: pt

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Início: index.md
  - Governança:
      - Visão geral: governanca/index.md
      - Política de documentação: governanca/politica-documentacao.md
      - Classificação da informação: governanca/classificacao-informacao.md
      - Publicar no GitHub: governanca/guia-publicacao-github.md
  - Microsoft 365:
      - Visão geral: microsoft-365/index.md
      - Exchange Online: microsoft-365/exchange-online/index.md
  - Entra ID:
      - Visão geral: entra-id/index.md
  - Intune:
      - Visão geral: intune/index.md
  - Defender:
      - Visão geral: defender/index.md
  - Cybersegurança:
      - Visão geral: cyberseguranca/index.md
  - Infraestrutura:
      - Visão geral: infraestrutura/index.md
  - Procedimentos:
      - Visão geral: procedimentos/index.md
      - Portal da Empresa: procedimentos/implementar-personalizar-portal-empresa.md
  - Troubleshooting: troubleshooting/index.md
  - Scripts: scripts/index.md
  - Histórico: changelog/index.md
