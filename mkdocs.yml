              - Novo aplicativo: intune/portal-empresa/modelos/template-novo-aplicativo.md
              - Novo procedimento: intune/portal-empresa/modelos/template-procedimento.md
              - Registro de mudança: intune/portal-empresa/modelos/template-registro-mudanca.md
  - Defender:
      - Visão geral: defender/index.md
  - Cybersegurança:
