              - Como adicionar: intune/portal-empresa/aplicativos/adicionar-aplicativos.md
              - Google Chrome: intune/portal-empresa/aplicativos/google-chrome.md
              - TeamViewer Host: intune/portal-empresa/aplicativos/teamviewer-host.md
          - Operação:
